# docker-compose.yml

services:
  db:
    image: postgres:16-alpine
    # Usa só a imagem já presente na máquina (não baixa da internet)
    pull_policy: never
    container_name: chathub-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chathub_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chat-hub:
    build: .
    container_name: chat-hub
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${PORT:-8765}:8765"
    restart: unless-stopped

volumes:
  chathub_pgdata:
